<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Strategy Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- React App Root -->
    <div id="root"></div>
    
    <!-- Debug: Check if libraries loaded -->
    <script>
        console.log('=== Library Loading Check ===');
        console.log('React loaded:', typeof React !== 'undefined');
        console.log('ReactDOM loaded:', typeof ReactDOM !== 'undefined');
        console.log('Chart.js loaded:', typeof Chart !== 'undefined');
        
        if (typeof Chart !== 'undefined') {
            console.log('✅ Chart.js version:', Chart.version);
        } else {
            console.error('❌ Chart.js failed to load!');
        }
    </script>
    
    <!-- Modular Application JavaScript - Load in correct order -->
    <!-- 1. Core utilities and API client -->
    <script type="text/babel" src="/static/js/core.js"></script>
    
    <!-- 2. Reusable components -->
    <script type="text/babel" src="/static/js/components.js"></script>
    
    <!-- 3. Chart components -->
    <script type="text/babel" src="/static/js/charts.js"></script>
    
    <!-- 4. View modules -->
    <script type="text/babel" src="/static/js/dashboard.js"></script>
    <script type="text/babel" src="/static/js/trades.js"></script>
    <script type="text/babel" src="/static/js/comparison.js"></script>
    
    <!-- 5. Main application (last) -->
    <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
